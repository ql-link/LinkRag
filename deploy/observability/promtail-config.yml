server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: tolink-service-java
    static_configs:
      - targets:
          - localhost
        labels:
          job: tolink-service-java
          service: tolink-service
          __path__: /var/log/tolink-service/*/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service_json: service
            host: host
      - template:
          source: service
          template: '{{ if .service_json }}{{ .service_json }}{{ else }}tolink-service{{ end }}'
      - labels:
          service:
          level:
          host:

  - job_name: tolink-rag-python
    static_configs:
      - targets:
          - localhost
        labels:
          job: tolink-rag-python
          service: tolink-rag
          __path__: /var/log/tolink-rag/*/*.log
    pipeline_stages:
      - json:
          expressions:
            level: record.level.name
            service_json: record.extra.service
            host: record.extra.host
      - template:
          source: service
          template: '{{ if .service_json }}{{ .service_json }}{{ else }}tolink-rag{{ end }}'
      - labels:
          service:
          level:
          host:
