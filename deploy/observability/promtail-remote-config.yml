server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL}

scrape_configs:
  - job_name: tolink-service-java
    static_configs:
      - targets:
          - localhost
        labels:
          job: tolink-service-java
          service: tolink-service
          __path__: /var/log/tolink-service/*/*.log
    pipeline_stages:
      - json:
          expressions:
            level_json: level
            service_json: service
            host: host
      - regex:
          expression: '^\S+\s+\S+\s+(?P<level_text>[A-Z]+)\s+'
      - template:
          source: level
          template: '{{ if .level_json }}{{ .level_json }}{{ else }}{{ .level_text }}{{ end }}'
      - template:
          source: service
          template: '{{ if .service_json }}{{ .service_json }}{{ else }}tolink-service{{ end }}'
      - labels:
          service:
          level:
          host:

  - job_name: tolink-rag-python
    static_configs:
      - targets:
          - localhost
        labels:
          job: tolink-rag-python
          service: tolink-rag
          __path__: /var/log/tolink-rag/*/*.log
    pipeline_stages:
      - json:
          expressions:
            level_json: record.level.name
            service_json: record.extra.service
            host: record.extra.host
      - regex:
          expression: '^\S+\s+\S+\s+\|\s*(?P<level_text>[A-Z]+)\s*\|'
      - template:
          source: level
          template: '{{ if .level_json }}{{ .level_json }}{{ else }}{{ .level_text }}{{ end }}'
      - template:
          source: service
          template: '{{ if .service_json }}{{ .service_json }}{{ else }}tolink-rag{{ end }}'
      - labels:
          service:
          level:
          host:
