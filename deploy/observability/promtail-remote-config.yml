server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL}

scrape_configs:
  - job_name: tolink-service-java
    static_configs:
      - targets:
          - localhost
        labels:
          job: tolink-service-java
          service: tolink-service
          # 只采集全量主文件，避免 ERROR 同时从主文件和 *-error.log 重复进入 Loki。
          __path__: /var/log/tolink-service/*/tolink-service.log
    pipeline_stages:
      - json:
          expressions:
            level_json: level
            service_json: service
            host: host
            log_timestamp: time
      - timestamp:
          source: log_timestamp
          format: RFC3339Nano
          action_on_failure: skip
      - regex:
          expression: '^\S+\s+\S+\s+(?P<level_text>[A-Z]+)\s+'
      - template:
          source: level
          template: '{{ if .level_json }}{{ .level_json }}{{ else }}{{ .level_text }}{{ end }}'
      - template:
          source: service
          template: '{{ if .service_json }}{{ .service_json }}{{ else }}tolink-service{{ end }}'
      - labels:
          service:
          level:
          host:

  - job_name: tolink-rag-python
    static_configs:
      - targets:
          - localhost
        labels:
          job: tolink-rag-python
          service: tolink-rag
          # Python 主文件名为 tolink-rag-<pid>.log；排除 tolink-rag-error-<pid>.log。
          __path__: /var/log/tolink-rag/*/tolink-rag-[0-9]*.log
    pipeline_stages:
      - json:
          expressions:
            level_json: record.level.name
            service_json: record.extra.service
            host: record.extra.host
            log_timestamp: record.time.repr
      - timestamp:
          source: log_timestamp
          format: "2006-01-02 15:04:05.999999999Z07:00"
          action_on_failure: skip
      - regex:
          expression: '^\S+\s+\S+\s+\|\s*(?P<level_text>[A-Z]+)\s*\|'
      - template:
          source: level
          template: '{{ if .level_json }}{{ .level_json }}{{ else }}{{ .level_text }}{{ end }}'
      - template:
          source: service
          template: 'tolink-rag'
      - labels:
          service:
          level:
          host:
