server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL}

scrape_configs:
  - job_name: tolink-service-test
    static_configs:
      - targets: [localhost]
        labels:
          environment: test
          service_name: tolink-service
          __path__: /var/log/tolink-service/**/*.log

  - job_name: tolink-rag-test
    static_configs:
      - targets: [localhost]
        labels:
          environment: test
          service_name: tolink-rag
          __path__: /var/log/tolink-rag/**/*.log
