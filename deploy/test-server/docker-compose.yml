# Primary 测试环境：独立业务数据与日志，不修改生产容器、端口和数据卷。
#
# 首次启动中间件：
#   docker compose --env-file .env.test up -d mysql redis kafka qdrant manticore loki
# 启动测试应用：
#   docker compose --env-file .env.test --profile apps up -d

services:
  mysql:
    image: mysql:8.0
    container_name: tolink-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${TEST_MYSQL_DATABASE:-tolink_rag_test}
      MYSQL_USER: ${TEST_MYSQL_USER:-tolink_test}
      MYSQL_PASSWORD: ${TEST_MYSQL_PASSWORD:?required}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_MYSQL_PORT:-13306}:3306"
    volumes:
      - test_mysql_data:/var/lib/mysql
    networks: [tolink-test-net]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.5

  redis:
    image: redis:7.2-alpine
    container_name: tolink-test-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${TEST_REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_REDIS_PORT:-16379}:6379"
    volumes:
      - test_redis_data:/data
    networks: [tolink-test-net]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  kafka:
    image: bitnami/kafka:3.7
    container_name: tolink-test-kafka
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_KRAFT_CLUSTER_ID: ${TEST_KAFKA_CLUSTER_ID:?required}
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@tolink-test-kafka:29093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:29093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://tolink-test-kafka:29092,EXTERNAL://${TAILSCALE_IP:-100.86.10.52}:${TEST_KAFKA_PORT:-19092}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_INTER_BROKER_USER: ${TEST_KAFKA_USER:-tolink_test}
      KAFKA_INTER_BROKER_PASSWORD: ${TEST_KAFKA_PASSWORD:?required}
      KAFKA_CLIENT_USERS: ${TEST_KAFKA_USER:-tolink_test}
      KAFKA_CLIENT_PASSWORDS: ${TEST_KAFKA_PASSWORD:?required}
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: ${TEST_KAFKA_PARTITIONS:-1}
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1024m
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_KAFKA_PORT:-19092}:19092"
    volumes:
      - test_kafka_data:/bitnami/kafka
    networks: [tolink-test-net]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'printf "%s\n" "security.protocol=SASL_PLAINTEXT" "sasl.mechanism=PLAIN" "sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$$KAFKA_CLIENT_USERS\" password=\"$$KAFKA_CLIENT_PASSWORDS\";" >/tmp/test-client.properties && /opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 --command-config /tmp/test-client.properties >/dev/null 2>&1'
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    mem_limit: 1536m
    cpus: 1.5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: tolink-test-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${TEST_QDRANT_API_KEY:?required}
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_QDRANT_HTTP_PORT:-16333}:6333"
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - test_qdrant_data:/qdrant/storage
    networks: [tolink-test-net]
    mem_limit: 3g
    cpus: 3

  manticore:
    image: manticoresearch/manticore:27.1.5
    container_name: tolink-test-manticore
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_MANTICORE_SQL_PORT:-19306}:9306"
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_MANTICORE_HTTP_PORT:-19308}:9308"
    volumes:
      - test_manticore_data:/var/lib/manticore
    networks: [tolink-test-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 768m
    cpus: 1

  loki:
    image: grafana/loki:2.9.8
    container_name: tolink-test-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_LOKI_PORT:-13100}:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - test_loki_data:/loki
    networks: [tolink-test-net]
    mem_limit: 512m
    cpus: 0.75

  tolink-rag:
    profiles: [apps]
    image: tolink-rag:${RAG_TAG:-test-latest}
    container_name: tolink-test-rag
    restart: unless-stopped
    env_file:
      - ./rag.env.test
      - ${RAG_SECRET_ENV_FILE:-/opt/tolink/test/secrets/rag.env}
    environment:
      TZ: Asia/Shanghai
      LOG_SERVICE_NAME: tolink-rag-test
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_RAG_PORT:-18000}:8000"
    volumes:
      - ${RAG_LOG_PATH:-/opt/tolink/test/toLink-Rag/logs}:/app/logs
    networks: [tolink-test-net]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      manticore: {condition: service_healthy}
    mem_limit: 2g
    cpus: 3

  tolink-service:
    profiles: [apps]
    image: tolink-service:${SERVICE_TAG:-test-latest}
    container_name: tolink-test-service
    restart: unless-stopped
    env_file:
      - ./app.env.test
      - ${APP_SECRET_ENV_FILE:-/opt/tolink/test/secrets/app.env}
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: test
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      RECALL_SESSION_STREAM_BASE_URL: http://${TAILSCALE_IP:-100.86.10.52}:${TEST_RAG_PORT:-18000}
      OBSERVABILITY_LOKI_BASE_URL: http://tolink-test-loki:3100
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_SERVICE_PORT:-18081}:8080"
    volumes:
      - ${SERVICE_CONFIG_PATH:-/opt/tolink/test/toLink-Service/config}:/app/config:ro
      - ${SERVICE_LOG_PATH:-/opt/tolink/test/toLink-Service/logs}:/app/logs
    networks: [tolink-test-net]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      loki: {condition: service_started}
    mem_limit: 1536m
    cpus: 2

  linkrag-web:
    profiles: [apps]
    image: linkrag-web:${WEB_TAG:-test-latest}
    container_name: tolink-test-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${TEST_WEB_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [tolink-test-net]
    depends_on:
      - tolink-service
      - tolink-rag
    mem_limit: 256m
    cpus: 0.5

  promtail:
    profiles: [apps]
    image: grafana/promtail:2.9.8
    container_name: tolink-test-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: http://tolink-test-loki:3100/loki/api/v1/push
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ${SERVICE_LOG_PATH:-/opt/tolink/test/toLink-Service/logs}:/var/log/tolink-service:ro
      - ${RAG_LOG_PATH:-/opt/tolink/test/toLink-Rag/logs}:/var/log/tolink-rag:ro
      - test_promtail_positions:/tmp
    networks: [tolink-test-net]
    depends_on:
      - loki
      - tolink-service
      - tolink-rag
    mem_limit: 256m
    cpus: 0.5

networks:
  tolink-test-net:
    name: tolink-test-net
    driver: bridge

volumes:
  test_mysql_data:
    name: tolink_test_mysql_data
  test_redis_data:
    name: tolink_test_redis_data
  test_kafka_data:
    name: tolink_test_kafka_data
  test_qdrant_data:
    name: tolink_test_qdrant_data
  test_manticore_data:
    name: tolink_test_manticore_data
  test_loki_data:
    name: tolink_test_loki_data
  test_promtail_positions:
    name: tolink_test_promtail_positions
