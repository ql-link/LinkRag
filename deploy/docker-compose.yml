# 部署用 compose：引用本机 docker build 出来的镜像并启动
# MySQL / Redis / MinIO / Manticore / Loki 位于云服务器的 tolink-app-net；
# Qdrant / Kafka 仍由主机服务器提供。
# 用法：TAG=xxx RAG_ENV_FILE=/opt/tolink/toLink-Rag/.env.production \
#   RAG_SECRET_ENV_FILE=/opt/tolink/toLink-Rag/.env.production.local \
#   docker compose -f deploy/docker-compose.yml up -d
services:
  tolink-rag:
    image: tolink-rag:${TAG:-latest}
    container_name: tolink-rag
    restart: always
    env_file:
      - ${RAG_ENV_FILE:-../.env.production}
      # 后加载的本机密钥覆盖基础文件中的空值；该文件不进入 Git 或镜像。
      - ${RAG_SECRET_ENV_FILE:-../.env.production.local}
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      # 日志持久化到宿主机，避免容器重建（每次重新部署）丢失按日期归档的日志文件。
      # 相对路径以本 compose 文件所在目录为基准（与 ../.env 同级），即部署目录根
      # /opt/tolink/toLink-Rag/logs/<YYYY-MM-DD>/...。需保持 .env 中 LOG_DIR=logs（相对路径）。
      - ../logs:/app/logs
    networks:
      - tolink-app-net
    # 启动前如需执行 Alembic 迁移，可改用：
    # command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"

networks:
  tolink-app-net:
    external: true
