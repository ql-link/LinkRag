# Primary 开发环境：独立业务数据与日志，不修改生产容器、端口和数据卷。
#
# 首次启动中间件：
#   docker compose --env-file .env.dev up -d mysql redis rabbitmq qdrant manticore loki
# 启动开发应用：
#   docker compose --env-file .env.dev --profile apps up -d

services:
  mysql:
    image: mysql:8.0
    container_name: tolink-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${DEV_MYSQL_DATABASE:-tolink_rag_dev}
      MYSQL_USER: ${DEV_MYSQL_USER:-tolink_dev}
      MYSQL_PASSWORD: ${DEV_MYSQL_PASSWORD:?required}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_MYSQL_PORT:-13306}:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    networks: [tolink-dev-net]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.5

  redis:
    image: redis:7.2-alpine
    container_name: tolink-dev-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${DEV_REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_REDIS_PORT:-16379}:6379"
    volumes:
      - dev_redis_data:/data
    networks: [tolink-dev-net]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: tolink-dev-rabbitmq
    hostname: tolink-dev-rabbitmq
    restart: unless-stopped
    env_file:
      - ${DEV_RABBITMQ_BROKER_ENV_FILE:-/opt/tolink/dev/config/rabbitmq/broker.env}
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_RABBITMQ_PORT:-5672}:5672"
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - dev_rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks: [tolink-dev-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    cpus: 1

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: tolink-dev-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${DEV_QDRANT_API_KEY:?required}
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_QDRANT_HTTP_PORT:-16333}:6333"
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - dev_qdrant_data:/qdrant/storage
    networks: [tolink-dev-net]
    mem_limit: 3g
    cpus: 3

  manticore:
    image: manticoresearch/manticore:27.1.5
    container_name: tolink-dev-manticore
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_MANTICORE_SQL_PORT:-19306}:9306"
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_MANTICORE_HTTP_PORT:-19308}:9308"
    volumes:
      - dev_manticore_data:/var/lib/manticore
    networks: [tolink-dev-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 768m
    cpus: 1

  loki:
    image: grafana/loki:2.9.8
    container_name: tolink-dev-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_LOKI_PORT:-13100}:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - dev_loki_data:/loki
    networks: [tolink-dev-net]
    mem_limit: 512m
    cpus: 0.75

  tolink-rag:
    profiles: [apps]
    image: tolink-rag:${RAG_TAG:-dev-latest}
    container_name: tolink-dev-rag
    restart: unless-stopped
    env_file:
      - ${RAG_DEV_ENV_FILE:-/opt/tolink/dev/config/rag/.env.development}
      - ${RAG_DEV_SECRET_ENV_FILE:-/opt/tolink/dev/config/rag/.env.development.local}
      - ${DEV_RABBITMQ_APP_ENV_FILE:-/opt/tolink/dev/config/rabbitmq/app.env}
    environment:
      TZ: Asia/Shanghai
      APP_ENV: development
      LOG_SERVICE_NAME: tolink-rag-dev
      DB_HOST: tolink-dev-mysql
      DB_PORT: 3306
      REDIS_HOST: tolink-dev-redis
      REDIS_PORT: 6379
      QDRANT_HOST: tolink-dev-qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      MANTICORE_HOST: tolink-dev-manticore
      MANTICORE_PORT: 9306
      MINIO_ENDPOINT: tolink-dev-minio:9000
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_RAG_PORT:-18000}:8000"
    volumes:
      - ${RAG_LOG_PATH:-/opt/tolink/dev/toLink-Rag/logs}:/app/logs
    networks: [tolink-dev-net]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      manticore: {condition: service_healthy}
    mem_limit: 2g
    cpus: 3

  tolink-service:
    profiles: [apps]
    image: tolink-service:${SERVICE_TAG:-dev-latest}
    container_name: tolink-dev-service
    restart: unless-stopped
    env_file:
      - ${DEV_RABBITMQ_APP_ENV_FILE:-/opt/tolink/dev/config/rabbitmq/app.env}
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/
      DB_HOST: tolink-dev-mysql
      DB_PORT: 3306
      REDIS_HOST: tolink-dev-redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://tolink-dev-minio:9000
      TOLINK_RECALL_SESSION_STREAM_BASE_URL: http://${TAILSCALE_IP:-100.86.10.52}:${DEV_RAG_PORT:-18000}
      OBSERVABILITY_LOKI_BASE_URL: http://tolink-dev-loki:3100
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_SERVICE_PORT:-18081}:8080"
    volumes:
      - ${SERVICE_DEV_CONFIG_DIR:-/opt/tolink/dev/config/service}:/app/config:ro
      - ${SERVICE_LOG_PATH:-/opt/tolink/dev/toLink-Service/logs}:/app/logs
    networks: [tolink-dev-net]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      loki: {condition: service_started}
    mem_limit: 1536m
    cpus: 2

  linkrag-web:
    profiles: [apps]
    image: linkrag-web:${WEB_TAG:-dev-latest}
    container_name: tolink-dev-web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${TAILSCALE_IP:-100.86.10.52}:${DEV_WEB_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [tolink-dev-net]
    depends_on:
      - tolink-service
      - tolink-rag
    mem_limit: 256m
    cpus: 0.5

  promtail:
    profiles: [apps]
    image: grafana/promtail:2.9.8
    container_name: tolink-dev-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: http://tolink-dev-loki:3100/loki/api/v1/push
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ${SERVICE_LOG_PATH:-/opt/tolink/dev/toLink-Service/logs}:/var/log/tolink-service:ro
      - ${RAG_LOG_PATH:-/opt/tolink/dev/toLink-Rag/logs}:/var/log/tolink-rag:ro
      - dev_promtail_positions:/tmp
    networks: [tolink-dev-net]
    depends_on:
      - loki
      - tolink-service
      - tolink-rag
    mem_limit: 256m
    cpus: 0.5

networks:
  tolink-dev-net:
    name: tolink-dev-net
    driver: bridge

volumes:
  dev_mysql_data:
    name: tolink_dev_mysql_data
  dev_redis_data:
    name: tolink_dev_redis_data
  dev_rabbitmq_data:
    name: tolink_dev_rabbitmq_data
  dev_qdrant_data:
    name: tolink_dev_qdrant_data
  dev_manticore_data:
    name: tolink_dev_manticore_data
  dev_loki_data:
    name: tolink_dev_loki_data
  dev_promtail_positions:
    name: tolink_dev_promtail_positions
