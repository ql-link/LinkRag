server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/rag/stream {
        proxy_pass http://tolink-dev-rag:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 服务端内部接口只走容器网络直连，公网入口一律 404（应用层另有服务令牌校验）。
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # 接入应用服务端 API 只走容器网络（tolink-app-net），公网不可达。
    location ^~ /api/v1/apps/ {
        return 404;
    }

    # Java 管理端已下线：全部管理接口由 Python 提供
    location /api/ {
        proxy_pass http://tolink-dev-rag:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300s;
    }

    location ^~ /tolink-dev-public/ {
        proxy_pass http://host.docker.internal:9000;
        proxy_set_header Host host.docker.internal:9000;
        proxy_read_timeout 300s;
    }

    location ^~ /tolink-dev-raw/ {
        proxy_pass http://host.docker.internal:9000;
        proxy_set_header Host host.docker.internal:9000;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /tolink-dev-docs/ {
        proxy_pass http://host.docker.internal:9000;
        proxy_set_header Host host.docker.internal:9000;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
