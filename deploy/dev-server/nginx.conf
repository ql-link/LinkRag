server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/rag/stream {
        proxy_pass http://tolink-dev-rag:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://tolink-dev-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300s;
    }

    location ^~ /tolink-dev-public/ {
        proxy_pass http://host.docker.internal:9000;
        proxy_set_header Host host.docker.internal:9000;
        proxy_read_timeout 300s;
    }

    location ^~ /tolink-dev-raw/ {
        proxy_pass http://host.docker.internal:9000;
        proxy_set_header Host host.docker.internal:9000;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ^~ /tolink-dev-docs/ {
        proxy_pass http://host.docker.internal:9000;
        proxy_set_header Host host.docker.internal:9000;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
