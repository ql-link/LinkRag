# 云服务器应用栈。
# 包含 Java 管理端、Python RAG 服务、前端，以及跟随应用部署的 Promtail。
# MySQL / Redis / MinIO / Qdrant / Manticore / Loki 已部署在云服务器的
# tolink-app-net 内网；RabbitMQ 与应用同机部署。
#
# 用法示例：
#   cd deploy/cloud-server
#   HOST_VPN_IP=100.86.10.52 \
#   RAG_TAG=a0c0592a SERVICE_TAG=f3c39554 WEB_TAG=4964c6ae \
#   docker compose up -d

services:
  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: tolink-rabbitmq
    hostname: tolink-rabbitmq
    restart: always
    env_file:
      - ${RABBITMQ_BROKER_ENV_FILE:-/opt/tolink/rabbitmq/broker.env}
    ports:
      - "${TAILSCALE_IP:-100.77.31.79}:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - tolink-app-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    cpus: 1

  tolink-service:
    image: tolink-service:${SERVICE_TAG:-latest}
    container_name: tolink-service
    restart: always
    env_file:
      - ${RABBITMQ_APP_ENV_FILE:-/opt/tolink/rabbitmq/app.env}
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - RECALL_SESSION_STREAM_BASE_URL=${RECALL_SESSION_STREAM_BASE_URL:-https://linkrag.cn}
      - OBSERVABILITY_LOKI_BASE_URL=${OBSERVABILITY_LOKI_BASE_URL:-http://tolink-loki:3100}
    volumes:
      # application-prod.yml 已打入镜像；这里只挂载服务器长期保存的密钥覆盖文件。
      - ${SERVICE_SECRET_CONFIG_FILE:-/opt/tolink/toLink-Service/config/application-prod-local.yml}:/app/config/${SERVICE_SECRET_CONFIG_NAME:-application-prod-local.yml}:ro
      - ${SERVICE_LOG_PATH:-/opt/tolink/toLink-Service/logs}:/app/logs
    ports:
      - "${SERVICE_HTTP_PORT:-8080}:8080"
    networks:
      - tolink-app-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  tolink-rag:
    image: tolink-rag:${RAG_TAG:-latest}
    container_name: tolink-rag
    restart: always
    env_file:
      - ${RAG_ENV_FILE:-/opt/tolink/toLink-Rag/.env.production}
      - ${RAG_SECRET_ENV_FILE:-/opt/tolink/toLink-Rag/.env.production.local}
      - ${RABBITMQ_APP_ENV_FILE:-/opt/tolink/rabbitmq/app.env}
    environment:
      TZ: Asia/Shanghai
      LOG_SERVICE_NAME: tolink-rag
    volumes:
      - ${RAG_LOG_PATH:-/opt/tolink/toLink-Rag/logs}:/app/logs
    ports:
      - "${RAG_HTTP_PORT:-8000}:8000"
    networks:
      - tolink-app-net
    depends_on:
      rabbitmq:
        condition: service_healthy

  linkrag-web:
    image: linkrag-web:${WEB_TAG:-latest}
    container_name: linkrag-web
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ${WEB_NGINX_CONF:-/opt/tolink/LinkRag-Web/nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_WEBROOT:-/opt/tolink/letsencrypt/www}:/var/www/certbot:ro
      - ${LETSENCRYPT_CONF:-/opt/tolink/letsencrypt/conf}:/etc/letsencrypt:ro
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    networks:
      - tolink-app-net
    depends_on:
      - tolink-service
      - tolink-rag

  promtail:
    image: grafana/promtail:2.9.8
    container_name: tolink-promtail
    restart: always
    command:
      - -config.file=/etc/promtail/promtail-remote-config.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://tolink-loki:3100/loki/api/v1/push}
    volumes:
      - ../observability/promtail-remote-config.yml:/etc/promtail/promtail-remote-config.yml:ro
      - ${SERVICE_LOG_PATH:-/opt/tolink/toLink-Service/logs}:/var/log/tolink-service:ro
      - ${RAG_LOG_PATH:-/opt/tolink/toLink-Rag/logs}:/var/log/tolink-rag:ro
      - promtail_positions:/tmp
    networks:
      - tolink-app-net
    depends_on:
      - tolink-service
      - tolink-rag

networks:
  tolink-app-net:
    external: true

volumes:
  promtail_positions:
  rabbitmq_data:
    name: tolink_rabbitmq_data
