# 生产站点 linkrag.cn 的 Nginx 配置（挂载到 linkrag-web 容器 /etc/nginx/conf.d/default.conf）。
# 由 deploy/scripts/build-web-production-on-cloud.sh 安装到 /opt/tolink/LinkRag-Web/nginx/default.conf，
# 安装前备份旧文件，nginx -t 失败时自动还原。
proxy_cache_path /var/cache/nginx/tolink-public levels=1:2 keys_zone=tolink_public:20m max_size=1g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/tolink-minio levels=1:2 keys_zone=tolink_minio:50m max_size=5g inactive=7d use_temp_path=off;

server {
    listen       80;
    server_name  linkrag.cn www.linkrag.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    client_max_body_size 25m;
    listen       443 ssl;
    http2 on;
    server_name  linkrag.cn www.linkrag.cn;

    ssl_certificate     /etc/letsencrypt/live/linkrag.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkrag.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    root   /usr/share/nginx/html;
    index  index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 带哈希的构建产物长期缓存；index.html 不缓存，保证发布后立即生效
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # SSE 流式问答：关闭缓冲，放宽读超时
    location = /api/v1/rag/stream {
        proxy_pass         http://tolink-rag:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # 服务端内部接口只走容器网络直连，公网入口一律 404（应用层另有服务令牌校验）。
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # 接入应用服务端 API 只走容器网络（tolink-app-net），公网不可达。
    location ^~ /api/v1/apps/ {
        return 404;
    }

    # 管理与业务接口统一由 Python（tolink-rag）提供；Java 管理端已下线。
    location /api/ {
        proxy_pass         http://tolink-rag:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        # 历史数据中可能残留旧对象存储地址，统一改写为同源路径。
        proxy_set_header   Accept-Encoding   "";
        sub_filter_types   application/json;
        sub_filter_once    off;
        sub_filter         "http://103.205.254.30:39000/tolink-public/" "/tolink-public/";
        sub_filter         "http://100.86.10.52:9000/tolink-public/" "/tolink-public/";
        sub_filter         "http://117.72.214.40:8000/api/v1/rag/stream" "/api/v1/rag/stream";
    }

    # 公共 OSS 文件代理，避免 HTTPS 页面加载 HTTP 图片被浏览器拦截
    location ^~ /tolink-public/ {
        proxy_pass         http://tolink-minio:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache        tolink_public;
        proxy_cache_valid  200 301 302 30d;
        proxy_cache_valid  404 1m;
        proxy_cache_lock   on;
        proxy_cache_revalidate on;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # MinerU 云端解析入口：公网域名 -> 云服务器 Nginx -> 同网络 MinIO RAW 桶
    location ^~ /tolink-rag-raw/ {
        proxy_pass         http://tolink-minio:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache        tolink_minio;
        proxy_cache_valid  200 206 7d;
        proxy_cache_valid  404 1m;
        proxy_cache_lock   on;
        proxy_cache_revalidate on;
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # Python RAG 解析产物代理；保持 MINIO_PUBLIC_ENDPOINT 生成的对象 URL 可访问
    location ^~ /tolink-rag-docs/ {
        proxy_pass         http://tolink-minio:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Primary 测试环境对象存储入口；测试账号仅能访问 tolink-test-* bucket。
    location ~ ^/(tolink-test-public|tolink-test-raw|tolink-test-docs)/ {
        proxy_pass         http://100.86.10.52:9000;
        proxy_set_header   Host              100.86.10.52:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # GitHub -> Jenkins 分支构建 Webhook。令牌仅通过 HTTPS 查询参数传递。
    location = /jenkins-github-webhook {
        proxy_pass         http://100.86.10.52:28080/generic-webhook-trigger/invoke$is_args$args;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # SPA 前端路由兜底
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri $uri/ /index.html;
    }
}
