# 主机服务器中间件栈。
# 与仓库根目录 docker-compose.yml 保持同一部署边界：只包含共享中间件，
# 不包含 Java/Python/Web 应用，也不包含需要读取云服务器本机日志的 Promtail。
#
# 用法：
#   cd deploy/host-server
#   docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: tolink-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "ql354210"
      MYSQL_DATABASE: tolink_rag_db
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tolink-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pql354210"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: tolink-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ql354210
    networks:
      - tolink-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ql354210", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tolink-dev-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: ql354210
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - tolink-net
      - tolink-dev-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: tolink-prod-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tolink-net

  # Manticore 承载 BM25 全文检索；Qdrant 继续承载 dense / learned sparse 向量。
  # 9306 是应用使用的 MySQL wire protocol 端口，9308 是 HTTP(S) 管理端口。
  manticore:
    # 固定已验证版本，避免 latest 升级导致 tokenizer / ranker 行为漂移。
    image: manticoresearch/manticore:27.1.5
    container_name: tolink-manticore
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - manticore_data:/var/lib/manticore
    networks:
      - tolink-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  loki:
    image: grafana/loki:2.9.8
    container_name: tolink-loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_HTTP_PORT:-3100}:3100"
    volumes:
      - ../observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - tolink-net

networks:
  tolink-net:
    driver: bridge
  tolink-dev-net:
    external: true
    name: tolink-dev-net

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
  manticore_data:
  loki_data:
