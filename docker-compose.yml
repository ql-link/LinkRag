# 主机服务器中间件栈：只放共享基础设施，不放云服务器应用组件。
services:
  mysql:
    image: mysql:8.0
    container_name: tolink-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "ql354210"
      MYSQL_DATABASE: tolink_rag_db
    command: [
      'mysqld',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci'
    ]
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tolink-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pql354210"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: tolink-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ql354210
    networks:
      - tolink-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ql354210", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tolink-dev-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: ql354210
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - tolink-net
      - tolink-dev-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: tolink-prod-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tolink-net

  # BM25 固定使用 Manticore（见 src/core/storage/manticore_bm25）。
  # 9306 是 SQL 协议端口（MYSQL wire protocol，代码走这个口）；9308 是 HTTP(S) 端口。
  manticore:
    # 召回基线与集成测试固定在 27.1.5；禁止 latest 静默升级改变 tokenizer/ranker 行为。
    image: manticoresearch/manticore:27.1.5
    container_name: tolink-manticore
    restart: always
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - manticore_data:/var/lib/manticore
    networks:
      - tolink-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  loki:
    image: grafana/loki:2.9.8
    container_name: tolink-loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_HTTP_PORT:-3100}:3100"
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - tolink-net

networks:
  tolink-net:
    driver: bridge
  tolink-dev-net:
    external: true
    name: tolink-dev-net

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
  manticore_data:
  loki_data:
