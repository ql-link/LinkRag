name: Alembic Migrations

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, main]

jobs:
  upgrade-head:
    name: Run alembic upgrade head on ephemeral MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tolink_rag_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # 只装 migration 运行所需的最小集合，避免装整个 RAG 重依赖
          pip install "alembic>=1.13.0" "SQLAlchemy>=2.0.0" "pymysql>=1.1.0" \
                      "pydantic>=2.5.0" "pydantic-settings>=2.1.0" "loguru>=0.7.0" \
                      "cryptography>=42.0.0"

      - name: Prepare CI migration evidence and encrypted seed
        env:
          API_KEY_ENCRYPTION_SECRET: "0101010101010101010101010101010101010101010101010101010101010101"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.core.llm.encryption import encrypt_api_key

          capabilities = (
              "CHAT",
              "EMBEDDING",
              "SPARSE_EMBEDDING",
              "VISION",
              "RERANK",
              "ASR",
          )
          ciphertexts = {
              capability: encrypt_api_key(f"ci-only-{capability.lower()}")
              for capability in capabilities
          }
          evidence = {
              "maintenance_lock": "HELD",
              "legacy_llm_writer_count": 0,
              "legacy_llm_message_lag": 0,
              "seed_ciphertext_count": len(capabilities),
              "seed_capability_set": list(capabilities),
          }
          Path("/tmp/llm-ci-ciphertexts.json").write_text(
              json.dumps({"ciphertexts": ciphertexts}), encoding="utf-8"
          )
          Path("/tmp/llm-ci-evidence.json").write_text(
              json.dumps(evidence), encoding="utf-8"
          )
          PY

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL failed to start"; exit 1

      - name: Bootstrap schema from baseline (migrations/db.sql)
        env:
          MYSQL_PWD: root
        run: |
          # 模拟"存量库"：先用 migrations/db.sql 建出 0001 baseline 形态的 schema，
          # 然后 stamp 0001 锁定基线，再跑 upgrade head 验证迁移序列。
          mysql -h 127.0.0.1 -P 3306 -uroot tolink_rag_db < migrations/db.sql

      - name: Stamp baseline (0001)
        env:
          ALEMBIC_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tolink_rag_db
          PYTHONPATH: ${{ github.workspace }}
        run: alembic stamp 0001

      - name: Run alembic upgrade head through migration preflight
        env:
          ALEMBIC_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tolink_rag_db
          API_KEY_ENCRYPTION_SECRET: "0101010101010101010101010101010101010101010101010101010101010101"
          PYTHONPATH: ${{ github.workspace }}
          TOLINK_LLM_MIGRATION_AUTH_SECRET: ci-only-migration-authorization-secret
        run: |
          python scripts/release/llm_config_migration_preflight.py \
            --evidence /tmp/llm-ci-evidence.json \
            --ciphertexts /tmp/llm-ci-ciphertexts.json \
            --authorization-file /tmp/llm-ci-authorization.json \
            --run-migration

      - name: Run alembic upgrade head again (idempotency)
        env:
          ALEMBIC_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tolink_rag_db
          PYTHONPATH: ${{ github.workspace }}
        run: alembic upgrade head

      - name: Print final version
        env:
          ALEMBIC_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tolink_rag_db
          PYTHONPATH: ${{ github.workspace }}
        run: alembic current
